<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Decisão Estratégica • Automação & IA</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            corp: {
              950: '#060B17',
              900: '#0B132B',
              850: '#111C3D',
              800: '#1C2951',
              700: '#2A3C72',
              gold: '#E5B869',
              goldLight: '#F5DEB3',
              cyan: '#38BDF8',
              emerald: '#10B981',
              rose: '#F43F5E'
            }
          }
        }
      }
    }
  </script>
  <style>
    @media print {
      body { background: #ffffff !important; color: #0f172a !important; }
      .no-print { display: none !important; }
      .print-box { border: 1px solid #cbd5e1 !important; box-shadow: none !important; background: #ffffff !important; color: #0f172a !important; }
      .print-text-dark { color: #0f172a !important; }
      .print-subtext { color: #475569 !important; }
    }
    @keyframes pulseGlow {
      0%, 100% { stroke-dashoffset: 0; opacity: 0.8; }
      50% { stroke-dashoffset: -16; opacity: 1; }
    }
    .flow-line-active {
      stroke-dasharray: 6 6;
      animation: pulseGlow 3s linear infinite;
    }
  </style>
</head>
<body class="bg-corp-950 text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-corp-cyan/30 selection:text-white">

  <!-- Executive Header -->
  <header class="border-b border-slate-800/80 bg-corp-900/90 backdrop-blur-md sticky top-0 z-50 no-print">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-corp-850 to-corp-800 border border-slate-700/80 flex items-center justify-center text-corp-gold shadow-inner">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3v11.25A2.25 2.25 0 006 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0118 16.5h-2.25m-7.5 0h7.5m-7.5 0l-1 3m8.5-3l1 3m0 0l.5 1.5m-.5-1.5h-9.5m0 0l-.5 1.5M9 11.25v1.5M12 9v3.75m3-6v6"/>
          </svg>
        </div>
        <div>
          <span class="text-[10px] uppercase font-bold tracking-widest text-corp-gold/90 font-display block leading-none">Decision Engine • C-Level Advisory</span>
          <h1 class="text-sm sm:text-base font-bold text-white tracking-tight">Automação Inteligente & IA Agêntica</h1>
        </div>
      </div>
      
      <div class="flex items-center space-x-3">
        <button onclick="resetFlow()" class="text-xs px-3 py-1.5 rounded-lg border border-slate-800 bg-slate-900/80 text-slate-400 hover:text-slate-200 hover:border-slate-700 transition flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
          <span class="hidden sm:inline">Reiniciar</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Interactive Decision Graph / Timeline Blueprint (Visual Tree) -->
  <section class="border-b border-slate-800/60 bg-corp-900/40 no-print">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4">
      <div class="flex items-center justify-between text-xs mb-3 text-slate-400">
        <span class="font-display font-semibold tracking-wider uppercase text-slate-400 flex items-center gap-2">
          <span class="w-1.5 h-1.5 rounded-full bg-corp-gold animate-ping"></span>
          Árvore Dinâmica de Decisão (Clique em uma etapa para alterar)
        </span>
        <span id="completionRate" class="font-mono text-slate-300">25%</span>
      </div>

      <!-- Node Timeline Flow -->
      <div id="treeContainer" class="grid grid-cols-2 md:grid-cols-4 gap-2.5 sm:gap-4">
        <!-- Rendered by JS -->
      </div>
    </div>
  </section>

  <!-- Main Canvas -->
  <main class="flex-1 max-w-4xl mx-auto w-full px-4 sm:px-6 py-8 sm:py-10 flex flex-col justify-center">

    <!-- Active Question Card -->
    <section id="questionCard" class="bg-corp-900/60 border border-slate-800/90 rounded-2xl p-6 sm:p-8 backdrop-blur-xl shadow-2xl relative overflow-hidden transition-all duration-300">
      <div class="absolute -top-32 -right-32 w-64 h-64 bg-corp-cyan/5 rounded-full blur-3xl pointer-events-none"></div>
      <div id="questionInner"></div>
    </section>

    <!-- Comprehensive Executive Diagnostics Dashboard (Rendered upon conclusion) -->
    <section id="resultCard" class="hidden space-y-6"></section>

  </main>

  <!-- Minimal Footer -->
  <footer class="border-t border-slate-900 bg-corp-950 py-5 text-center text-xs text-slate-500 no-print">
    <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <p>Estrutura fundamentada no Princípio da Parcimônia Algorítmica e benchmarks BCG / Gartner (2025-2026).</p>
      <span>Governança & Soberania Digital</span>
    </div>
  </footer>

  <script>
    // State Machine
    const appState = {
      step: 1, // 1, 2, 3, 4, or 'result'
      answers: {
        1: null,
        2: null,
        3: null,
        4: null
      },
      verdictType: null // 'q1_exit', 'q2_exit', or 'completed'
    };

    // Diagnostic Nodes Data
    const workflowNodes = [
      { id: 1, label: "Maturidade", sub: "Padronização" },
      { id: 2, label: "Fronteira", sub: "Sistemas & Regras" },
      { id: 3, label: "Operação", sub: "Fazer vs Pensar" },
      { id: 4, label: "Governança", sub: "Soberania & Custo" }
    ];

    const questions = {
      1: {
        stepNumber: 1,
        stepTag: "Filtro 1 • Maturidade do Processo",
        title: "O processo que você deseja aprimorar já possui etapas claras, padronizadas e mapeadas?",
        contextReason: "Automatizar um processo caótico apenas amplifica erros com maior velocidade, desperdiçando capital em licenças sem capturar valor.",
        options: [
          {
            key: "NAO",
            badge: "Não Mapeado",
            badgeType: "warn",
            title: "Não, o processo possui variações informais",
            desc: "Ainda há retrabalho, indefinições de alçadas ou regras informais na rotina dos colaboradores.",
            leadsTo: "exit_1"
          },
          {
            key: "SIM",
            badge: "Padronizado",
            badgeType: "success",
            title: "Sim, o processo é claro e estruturado",
            desc: "As etapas são documentadas, os desvios conhecidos e a execução opera de maneira previsível.",
            leadsTo: 2
          }
        ]
      },
      2: {
        stepNumber: 2,
        stepTag: "Filtro 2 • Fronteira Sistêmica",
        title: "A tarefa ocorre dentro de um único software e exige apenas validações matemáticas ou cálculos fixos?",
        contextReason: "Evita o over-engineering. Soluções nativas eliminam a necessidade de contratar RPA ou inteligência artificial externa.",
        options: [
          {
            key: "SIM",
            badge: "Monolítico",
            badgeType: "warn",
            title: "Sim, ocorre em um único sistema sob regras numéricas",
            desc: "A rotina opera em um único ERP, CRM ou sistema legado com validações puramente matemáticas ou lógicas fixas de alçada.",
            leadsTo: "exit_2"
          },
          {
            key: "NAO",
            badge: "Multiplataforma",
            badgeType: "success",
            title: "Não, cruza sistemas ou dados heterogêneos",
            desc: "Exige trânsito de dados entre múltiplas aplicações, documentos externos ou tarefas cognitivas.",
            leadsTo: 3
          }
        ]
      },
      3: {
        stepNumber: 3,
        stepTag: "Passo 2 • A Escada Tecnológica",
        title: "Qual é a principal atividade executada pelo seu time nesse gargalo?",
        contextReason: "Define a alocação entre 'mãos digitais' (músculo de execução mecânica) e 'cérebro digital' (interpretação semântica sob incerteza).",
        options: [
          {
            key: "A",
            badge: "Mãos Digitais (Fazer)",
            badgeType: "neutral",
            title: "Opção A: Copiar, validar e transferir dados tabulares entre sistemas sob regras fixas",
            desc: "Direcionamento: Automação Transacional (RPA - Degrau 1). Execução determinística de rotinas repetitivas.",
            leadsTo: 4
          },
          {
            key: "B",
            badge: "Cérebro Digital (Pensar)",
            badgeType: "neutral",
            title: "Opção B: Interpretar textos livres, analisar documentos densos ou deliberar conhecimento",
            desc: "Direcionamento: Inteligência Artificial Cognitiva (Degraus 2 a 6). Análise semântica, sumarização e pareceres contextuais.",
            leadsTo: 4
          },
          {
            key: "C",
            badge: "Misto (Fazer + Pensar)",
            badgeType: "neutral",
            title: "Opção C: Receber documentos não estruturados, julgar o mérito e registrar no sistema",
            desc: "Direcionamento: Automação Integrada / Multiagente (Degrau 7). Orquestração completa de ponta a ponta.",
            leadsTo: 4
          }
        ]
      },
      4: {
        stepNumber: 4,
        stepTag: "Passo 3 • Arquétipos Organizacionais & Finanças",
        title: "Quais são a criticidade estratégica e a sensibilidade dos dados desse fluxo?",
        contextReason: "O arquétipo de implementação equilibra retenção de propriedade intelectual, velocidade e a distribuição entre CAPEX e OPEX.",
        options: [
          {
            key: "A",
            badge: "A Fortaleza",
            badgeType: "gold",
            title: "Opção A: Missão crítica corporativa (Core Business) ou sigilo bancário/regulatório estrito",
            desc: "Recomendação de Arquétipo: A FORTALEZA (Desenvolvimento Próprio com Tiny Teams e Soberania Total).",
            leadsTo: "result"
          },
          {
            key: "B",
            badge: "O Híbrido Ágil",
            badgeType: "gold",
            title: "Opção B: Processo departamental relevante com demanda por velocidade e autonomia das áreas",
            desc: "Recomendação de Arquétipo: O HÍBRIDO ÁGIL (Plataformas Low-Code integradas a APIs de IA com Governança de TI).",
            leadsTo: "result"
          },
          {
            key: "C",
            badge: "O Velocista",
            badgeType: "gold",
            title: "Opção C: Rotina de apoio padronizada de mercado ou validação ultrarrápida de piloto",
            desc: "Recomendação de Arquétipo: O VELOCISTA (SaaS / AIaaS Terceirizado e Conversão 100% em OPEX).",
            leadsTo: "result"
          }
        ]
      }
    };

    // Render Timeline / Dynamic Tree View
    function renderDecisionTree() {
      const container = document.getElementById('treeContainer');
      const rateLabel = document.getElementById('completionRate');

      let completedSteps = 0;
      if (appState.verdictType) {
        completedSteps = 4;
      } else {
        completedSteps = appState.step - 1;
      }
      rateLabel.textContent = `${Math.min(100, Math.round((completedSteps / 4) * 100))}%`;

      container.innerHTML = workflowNodes.map(node => {
        const isCurrent = appState.step === node.id && !appState.verdictType;
        const answer = appState.answers[node.id];
        const isAnswered = answer !== null;
        const isDisabled = !isAnswered && !isCurrent;

        let statusClass = "border-slate-800 bg-slate-900/40 text-slate-500 opacity-60";
        let dotClass = "bg-slate-700";

        if (isCurrent) {
          statusClass = "border-corp-cyan/80 bg-corp-850/80 text-white shadow-lg ring-1 ring-corp-cyan/30";
          dotClass = "bg-corp-cyan animate-pulse";
        } else if (isAnswered) {
          statusClass = "border-slate-700/80 bg-slate-900/90 text-slate-200 hover:border-corp-gold/70 cursor-pointer";
          dotClass = "bg-corp-gold";
        }

        let answerSummary = "Pendente";
        if (node.id === 1 && answer) answerSummary = answer === 'SIM' ? 'Processo Maduro' : 'Imaturo (Redesenho)';
        if (node.id === 2 && answer) answerSummary = answer === 'SIM' ? 'Único Software' : 'Multi-sistemas';
        if (node.id === 3 && answer) {
          if (answer === 'A') answerSummary = 'Mãos (RPA)';
          if (answer === 'B') answerSummary = 'Cérebro (IA)';
          if (answer === 'C') answerSummary = 'Misto (Multiagente)';
        }
        if (node.id === 4 && answer) {
          if (answer === 'A') answerSummary = 'A Fortaleza';
          if (answer === 'B') answerSummary = 'O Híbrido Ágil';
          if (answer === 'C') answerSummary = 'O Velocista';
        }

        return `
          <div onclick="${isAnswered ? `jumpToStep(${node.id})` : ''}"
               class="p-3 rounded-xl border transition-all duration-200 text-left ${statusClass} flex flex-col justify-between">
            <div class="flex items-center justify-between mb-1">
              <span class="text-[10px] font-mono tracking-wider uppercase text-slate-400">Nó 0${node.id}</span>
              <span class="w-2 h-2 rounded-full ${dotClass}"></span>
            </div>
            <div>
              <div class="text-xs font-semibold text-slate-200 font-display">${node.label}</div>
              <div class="text-[11px] truncate text-corp-gold/90 font-medium">${isAnswered ? answerSummary : node.sub}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Render Question Canvas
    function renderQuestion(stepNumber) {
      appState.step = stepNumber;
      appState.verdictType = null;

      const q = questions[stepNumber];
      const card = document.getElementById('questionCard');
      const resultCard = document.getElementById('resultCard');
      const inner = document.getElementById('questionInner');

      card.classList.remove('hidden');
      resultCard.classList.add('hidden');

      renderDecisionTree();

      inner.innerHTML = `
        <!-- Question Stage Header -->
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
          <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-md text-[11px] font-bold uppercase tracking-wider bg-corp-850 text-corp-cyan border border-corp-cyan/30 font-display">
            <span class="w-1.5 h-1.5 rounded-full bg-corp-cyan"></span>
            ${q.stepTag}
          </span>
          
          <div class="flex items-center space-x-2">
            ${stepNumber > 1 ? `
              <button onclick="previousStep()" class="text-xs px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-900 text-slate-300 hover:bg-slate-800 transition flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
                Voltar
              </button>
            ` : ''}
          </div>
        </div>

        <!-- Question Body -->
        <h2 class="text-lg sm:text-2xl font-extrabold text-white font-display tracking-tight leading-snug mb-3">
          ${q.title}
        </h2>

        <!-- Context Accordion Box -->
        <div class="p-3.5 rounded-xl bg-slate-950/70 border border-slate-800/90 mb-6 text-xs text-slate-300 flex items-start gap-2.5">
          <div class="p-1 rounded bg-corp-gold/10 text-corp-gold mt-0.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18v-5.25m0 0A2.25 2.25 0 109.75 10.5h4.5A2.25 2.25 0 0012 12.75zm0-7.5h.008v.008H12V5.25z"/></svg>
          </div>
          <div>
            <span class="font-bold text-corp-gold uppercase tracking-wider block text-[10px]">Por que esta decisão importa para o C-Level?</span>
            <p class="text-slate-400 mt-0.5 leading-relaxed">${q.contextReason}</p>
          </div>
        </div>

        <!-- Options Container -->
        <div class="grid grid-cols-1 ${q.options.length === 2 ? 'sm:grid-cols-2' : 'gap-3'} gap-3">
          ${q.options.map(opt => `
            <button onclick="selectOption(${stepNumber}, '${opt.key}', '${opt.leadsTo}')"
                    class="group text-left p-4 sm:p-5 rounded-xl border border-slate-800 bg-slate-900/80 hover:bg-corp-850 hover:border-corp-cyan/70 transition-all duration-200 flex flex-col justify-between shadow-md hover:shadow-corp-cyan/5">
              <div>
                <div class="flex items-center justify-between mb-2">
                  <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded font-display ${getBadgeStyle(opt.badgeType)}">
                    ${opt.badge}
                  </span>
                  <svg class="w-4 h-4 text-slate-600 group-hover:text-corp-cyan transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/>
                  </svg>
                </div>
                <h3 class="text-sm font-semibold text-slate-100 group-hover:text-white mb-1.5 leading-snug">${opt.title}</h3>
                <p class="text-xs text-slate-400 leading-relaxed font-light">${opt.desc}</p>
              </div>
            </button>
          `).join('')}
        </div>
      `;
    }

    function getBadgeStyle(type) {
      if (type === 'warn') return 'bg-rose-950/80 text-rose-300 border border-rose-800/60';
      if (type === 'success') return 'bg-emerald-950/80 text-emerald-300 border border-emerald-800/60';
      if (type === 'gold') return 'bg-amber-950/80 text-corp-gold border border-amber-800/60';
      return 'bg-slate-800 text-slate-300 border border-slate-700';
    }

    // State Transitions
    function selectOption(stepNumber, key, leadsTo) {
      appState.answers[stepNumber] = key;

      // Clear subsequent answers if editing earlier node
      for (let s = stepNumber + 1; s <= 4; s++) {
        appState.answers[s] = null;
      }

      if (leadsTo === 'exit_1') {
        appState.verdictType = 'q1_exit';
        renderDiagnostics();
      } else if (leadsTo === 'exit_2') {
        appState.verdictType = 'q2_exit';
        renderDiagnostics();
      } else if (leadsTo === 'result') {
        appState.verdictType = 'completed';
        renderDiagnostics();
      } else {
        renderQuestion(parseInt(leadsTo));
      }
    }

    function previousStep() {
      if (appState.step > 1) {
        renderQuestion(appState.step - 1);
      }
    }

    function jumpToStep(targetStep) {
      renderQuestion(targetStep);
    }

    function resetFlow() {
      appState.step = 1;
      appState.answers = { 1: null, 2: null, 3: null, 4: null };
      appState.verdictType = null;
      renderQuestion(1);
    }

    // Generate Final Diagnostics
    function renderDiagnostics() {
      const card = document.getElementById('questionCard');
      const resultCard = document.getElementById('resultCard');

      card.classList.add('hidden');
      resultCard.classList.remove('hidden');

      renderDecisionTree();

      let data = {};

      if (appState.verdictType === 'q1_exit') {
        data = {
          badge: "Filtro Preliminar: Maturidade Inexistente",
          badgeColor: "bg-rose-950/80 text-rose-300 border-rose-800",
          title: "Rota de Otimização Sem Tecnologia",
          recommendation: "Não automatize a ineficiência. Realize o redesenho e a simplificação do fluxo antes de contratar qualquer ferramenta.",
          verdictStep: "Degrau 0: Redesenho de Processos (Lean / BPM)",
          archetype: "Gestão Interna de Processos (BPMO / Liderança de Negócios)",
          summary: "O processo selecionado carece de clareza e padronização. Implementar robôs de RPA ou Inteligência Artificial neste estágio acelera a taxa de falhas e aumenta despesas de manutenção técnica.",
          finance: "CAPEX Zero | Custo restrito a horas-homem internas para modelagem e redução de atritos.",
          risk: "Risco Crítico de Automatizar Desperdício: Automatizar um processo ruim gera apenas um processo ruim que falha mais rápido.",
          nextSteps: [
            "Conduzir oficina de mapeamento do fluxo atual (As-Is) com operadores da ponta.",
            "Eliminar etapas redundantes, aprovações duplicadas e regras informais.",
            "Validar o novo fluxo simplificado (To-Be) manualmente por um ciclo completo.",
            "Retornar a este simulador após a homologação das novas regras."
          ],
          diagram: {
            input: "Processo Caótico (Gargalo & Desvios)",
            layer1: "Diagnóstico Humano & Análise Lean",
            layer2: "Redesenho & Padronização (As-Is → To-Be)",
            governance: "Comitê de Processos & Liderança Local",
            output: "Fluxo Estável & Elegível à Automação",
            accent: "#F43F5E"
          },
          phases: [
            { title: "Fase 1: Mapeamento & Expurgos", desc: "Mapear o fluxo As-Is e eliminar redundâncias de aprovação e retrabalho." },
            { title: "Fase 2: Homologação do To-Be", desc: "Redesenhar o processo e validar a execução manual padronizada por 30 dias." },
            { title: "Fase 3: Preparação para Automação", desc: "Documentar regras estáveis e submeter ao teste de automação (RPA/IA)." }
          ]
        };
      } else if (appState.verdictType === 'q2_exit') {
        data = {
          badge: "Filtro de Escopo: Fronteira Sistêmica Monolítica",
          badgeColor: "bg-amber-950/80 text-corp-gold border-amber-800",
          title: "Parametrização Nativa (Sem IA e Sem RPA)",
          recommendation: "Configure as regras de negócio no próprio sistema atual. Evite custos com ferramentas adicionais.",
          verdictStep: "Degrau 0: Configuração de Regras Nativas do ERP / CRM",
          archetype: "Governança Centralizada de TI / Parametrização Interna",
          summary: "Por se tratar de um fluxo confinado em um único sistema sob regras matemáticas fixas, a criação de robôs de RPA ou modelos de IA constitui 'over-engineering'.",
          finance: "CAPEX Zero | Custo absorvido pelo contrato de suporte já existente do seu software de gestão.",
          risk: "Risco de Proliferação de Ferramentas: Aquisição desnecessária de licenças adicionais gerando custos recorrentes dispensáveis.",
          nextSteps: [
            "Abrir solicitação interna de parametrização no módulo nativo do sistema.",
